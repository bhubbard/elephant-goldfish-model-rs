[workspace]
members = [
    "crates/egm-core",
    "crates/egm-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["casaos <casaos@casaos.casaos>"]
license = "Apache-2.0"
repository = "https://github.com/bhubbard/elephant-goldfish-model-rs"
readme = "README.md"
description = "Native Rust port of the Elephant-Goldfish Model (EGM) Spec-Driven Development framework"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "cargo"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
regex = "1.10"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"
tempfile = "3.17"
chrono = "0.4"
glob = "0.3"
