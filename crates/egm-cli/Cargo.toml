[package]
name = "egm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line tool for Elephant-Goldfish Model (EGM) Spec-Driven Development"
default-run = "egm"

[lib]
name = "egm_cli"
path = "src/lib.rs"

[[bin]]
name = "egm"
path = "src/main.rs"

[[bin]]
name = "goldfish"
path = "src/bin/goldfish.rs"

[dependencies]
egm-core = { path = "../egm-core" }
clap.workspace = true
colored.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
walkdir.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
